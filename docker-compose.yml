services:
  postgres:
    image: postgres:16-alpine
    container_name: shadow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shadow_admin
      POSTGRES_PASSWORD: shadow_dev_pw
      POSTGRES_DB: shadow_platform
    ports:
      - "5433:5432"
    volumes:
      - shadow_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: shadow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shadow_minio_admin
      MINIO_ROOT_PASSWORD: shadow_minio_secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - shadow_minio_data:/data

  # One-shot helper that creates the documents bucket on first startup so you
  # don't have to click through the MinIO console manually.
  minio-init:
    image: minio/mc:latest
    container_name: shadow-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 shadow_minio_admin shadow_minio_secret) do echo waiting for minio...; sleep 1; done;
      mc mb -p local/shadow-documents;
      exit 0;
      "

volumes:
  shadow_postgres_data:
  shadow_minio_data:
